<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/favicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <title>Jog & Joy</title>
</head>

<body>
  <div id="error-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,0,0,0.9); color: white; padding: 2rem; z-index: 999999; overflow: auto; font-family: monospace;">
    <h1>Application Error</h1>
    <pre id="error-message"></pre>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('error-overlay').style.display = 'block';
      document.getElementById('error-message').textContent = e.error ? e.error.stack : e.message;
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('error-overlay').style.display = 'block';
      document.getElementById('error-message').textContent = e.reason ? e.reason.stack || e.reason : e.promise;
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
